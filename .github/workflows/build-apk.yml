name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.YETER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/yeter.jks
            echo "Sabit imza anahtarı yüklendi."
          else
            echo "UYARI: YETER_KEYSTORE_B64 tanımlı değil, geçici debug imzası kullanılacak (üstüne kurulum çalışmaz)."
          fi

      - name: Build Debug APK
        env:
          YETER_KS_PASS: ${{ secrets.YETER_KS_PASS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "Yeter! v1.1.1 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.1.1 - Sabit imza ve hedef sabitleme

            - **Ana ekrana sabitleme:** Vitrin'deki her hedef kartında 📌 butonu var; sabitlediğin hedef ana ekrandaki halkada ve hedef kartında görünür. Sabitleme yoksa listenin en üstündeki hedef gösterilir.
            - **Üstüne kurulum:** Bu sürümden itibaren tüm APK'lar aynı sabit anahtarla imzalanır; sonraki sürümler mevcut uygulamanın üzerine, verilerin korunarak kurulur.
            - ⚠️ **Bir kerelik:** Daha önce kurduğun sürümler farklı (geçici) imzalıydı. Bu sürümü kurmadan önce eski Yeter'i bir kez kaldırman gerekir (kayıtlı veriler silinir).

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
