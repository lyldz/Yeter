name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Yeter! v1.0.6 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.6 - Döviz kuru düzeltmesi

            - **Kur sistemi sağlamlaştırıldı:** 4 ayrı kaynak sırayla denenir, biri çalışmazsa diğerine geçilir.
            - **Doğru yedek kurlar:** İnternet yokken kullanılan yaklaşık kurlar güncellendi (USD/TRY artık ~50).
            - **Hızlı yeniden deneme:** Kur çekilemezse 1 dakikada bir tekrar denenir.
            - **Kur durumu görünür:** Vitrin'in üstünde ve Ayarlar'da son güncelleme zamanı, durum ve "Yenile" butonu.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
