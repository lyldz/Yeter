name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Yeter! v1.0.5 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.5

            #### 🆕 Yenilikler
            - **Karşılama ekranı:** İlk açılışta para birimini, günlük tasarruf tutarını ve ilk hedefini seçersin (Claude Pro $20/ay hazır gelir).
            - **8 para birimi:** TRY, USD, EUR, GBP, CHF, JPY, CAD, AUD. Kurlar arka planda canlı güncellenir, hepsi birbirine çevrilir.
            - **Her sabah tasarruf sorusu:** "Bugün ne kadar tasarruf edeceksin?" Seçilen tutar o gün saniye saniye birikir.
            - **Bildirimler:** Sabah hatırlatması, hedefe yaklaşma (%50, %75, %90) ve hedefe ulaşma bildirimleri.
            - **Ana sayfa:** Bugün kazanılan tutar, direnilen dürtü sayısı ve yenilgi istatistikleri.
            - **Para birimi değişimi:** Ana para birimini değiştirirsen birikimin güncel kurla çevrilir.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
