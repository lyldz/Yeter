name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Yeter! v1.0.1 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.1 Sürümü Yayında

            #### 🚀 Yenilikler:
            - **Günlük Tasarruf:** Varsayılan değer 1 simit ve çay parası olan **30 TL** olarak ayarlandı.
            - **Ekran Düzeni Düzeltmesi:** Zaman sayacı kutucukları (GÜN : SAAT : DK : SN) tüm telefon ekran genişliklerine göre duyarlı hale getirildi, saniye kutusunun taşması engellendi.
            - **Canlı Süre:** İlk açılışta 0 gün 0 saat olarak şu andan itibaren başlama kurgusu sağlandı.
            - **Otomatik Güncelleme:** Uygulama açılışında arka planda yeni sürüm kontrolü eklendi; yeni sürüm çıktığında "Artık Yeter!" uyarısıyla indirme bağlantısı sunulur.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip doğrudan yükleyebilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
