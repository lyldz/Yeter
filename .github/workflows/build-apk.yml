name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.YETER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/yeter.jks
            echo "Sabit imza anahtarı yüklendi."
          else
            echo "UYARI: YETER_KEYSTORE_B64 tanımlı değil, geçici debug imzası kullanılacak (üstüne kurulum çalışmaz)."
          fi

      - name: Build Debug APK
        env:
          YETER_KS_PASS: ${{ secrets.YETER_KS_PASS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "Yeter! v1.1.2 - Görsel yenileme (APK)"
          body: |
            ### 🎨 Yeter! v1.1.2 - Görsel yenileme

            - **Yeni tasarım sistemi:** Tek bir tema dosyasında renkler, yazı ölçeği, köşe yarıçapları ve boşluklar toplandı; kartlar ve etiketler her ekranda aynı görünür. Derinlik gölgeyle değil, giderek açılan lacivert yüzeylerle verilir.
            - **Okunabilirlik:** En küçük yazı boyutu 12 sp oldu, sayaçtaki rakamlar sabit genişlikli olduğu için zıplamaz, kontrastlar güçlendirildi.
            - **Hareket:** Sekme geçişleri yumuşak, ilerleme çubukları animasyonlu, vitrin kartları yer değiştirirken kayar. DUR butonu basınca küçülür ve hafifçe nabız atar. Rozetler yay hareketiyle belirir.
            - **DUR ekranı:** "Sade mod" ile renksiz nefes dairesi; "Aldım / Yenildim" düğmesi artık "Vazgeçtim" ile aynı görsel ağırlıkta.
            - **Erişilebilirlik:** Para birimi seçicide 48 dp dokunma alanı, takvim günleri ekran okuyucuya "3. gün: 2 direnç, 0 yenilgi" diye okunur, alt gezinmede çift okuma giderildi.
            - **İkonlar:** Tek ikon ailesi (yuvarlak uçlu); seçili sekme dolu, seçilmemiş çizgili. Emoji yerine vektör ikonlar kullanıldı. Geçmiş sekmesine boş durum eklendi.
            - Veriler korunur; v1.1.1 üzerine doğrudan kurulur.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
