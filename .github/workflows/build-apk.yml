name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Yeter! v1.1.0 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.1.0 - Yeni tasarım

            #### 🎨 Görünüm
            - **Yeni renkler:** Gece laciverti zemin, nane yeşili vurgu, mercan kırmızısı sadece DUR uyarısı için.
            - **Yeni logo:** Nane rozet içinde duran el ("Yeter!" = dur). Uygulama ve bildirim ikonları yenilendi.
            - **Dev canlı sayaç:** Halka şeklinde ilerleme göstergesi, nabız gibi atan parıltı, saniyenin altında akıcı artan birikim sayısı.

            #### ✨ Yeni özellikler
            - **Geçmiş sekmesi:** Son 35 günün takvimi (direndiğin ve yenildiğin günler), dürtü kayıtları listesi.
            - **Başarılar:** 10 rozet (ilk direniş, 3 gün / 1 hafta / 1 ay seri, 20 ve 100 dolar birikim, ilk hedef...).
            - **Dürtü anında nefes egzersizi** ve dönen düşündürücü sorular.
            - **Çalışma saati hesabı:** Saatlik kazancını girersen dürtü anında "bu kaç saatlik çalışmana denk" gösterilir.
            - **Bildirim saati ayarı** ve **verileri dışa aktarma (yedek)**.
            - Kur durumu görünür; 4 kaynaklı sağlam kur sistemi (v1.0.6'dan).

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
