name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Yeter! v1.0.4 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.4

            Yeter, boşa para harcama dürtüne karşı bir frendir: hedefini koy, dürtüye direndikçe hedefe yaklaş.

            #### 🆕 Yenilikler
            - **Dürtü akışı:** DUR butonuna basınca ne almak istediğini ve tutarı yazarsın, 10 dakikalık bekleme başlar. Vazgeçersen tutar birikimine eklenir.
            - **Çoklu hedefler, çoklu para birimi:** Hedefler TL veya USD olabilir, aylık tekrar eden hedef desteklenir. Vitrin'de **Claude Pro ($20/ay)** hazır gelir.
            - **Günlük otomatik kur:** USD/TRY kuru günde bir kez internetten güncellenir.
            - **"Aldım" butonu:** Hedefe ulaşınca tutar birikimden düşer.
            - **Yeni kimlik:** Uygulama adı ve paket adı tamamen Yeter oldu.

            #### ⚠️ Önemli
            Paket adı değiştiği için bu sürüm eski sürümün üzerine güncelleme olarak kurulmaz, ayrı bir uygulama olarak kurulur. Eski sürümü kaldırabilirsiniz; eski verileriniz yeni uygulamaya taşınmaz.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
