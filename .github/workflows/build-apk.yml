name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version info
        id: ver
        run: |
          . <(grep -E '^(VERSION_NAME|VERSION_CODE|SERIES_NAME)=' version.properties)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "series=$SERIES_NAME" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.YETER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/yeter.jks
            echo "Sabit imza anahtarı yüklendi."
          else
            echo "UYARI: YETER_KEYSTORE_B64 tanımlı değil, geçici debug imzası kullanılacak (üstüne kurulum çalışmaz)."
          fi

      - name: Build Debug APK
        env:
          YETER_KS_PASS: ${{ secrets.YETER_KS_PASS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "Yeter! v${{ steps.ver.outputs.name }} · ${{ steps.ver.outputs.series }} (APK)"
          body_path: .github/release-notes.md
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
