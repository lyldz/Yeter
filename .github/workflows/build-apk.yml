name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Yeter! v1.0.3 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.3 Sürümü Yayında 🚀

            #### 🛍️ Yepyeni Özellik: VİTRİN BÖLÜMÜ (Alt Sekme)
            - **Alt Menü (Bottom Navigation):** 'Kumbara' ve 'Vitrin' sekmeleri eklendi.
            - **Beklenen Ürünler Vitrini:** Satın almayı ertelediğiniz veya hayal ettiğiniz ürünleri güncel fiyatlarıyla (örn: Altın Bileklik 9.500 TL, Kulaklık 4.500 TL) ekleyebilirsiniz.
            - **Canlı GERİ SAYIM Sayacı:** Belirlediğiniz günlük birikim miktarına göre ürün için **GÜN : SAAT : DK : SN** formatında saniye saniye geriye sayım başlar.
            - **Hedefe Ulaşılınca Kutlama:** Yeterli birikim sağlandığında sayaç yeşil kutlama rozetine dönüşür ve *"Hedefe Ulaşıldı, Satın Alabilirsin!"* mesajı gösterilir.
            - **Kalıcı Hafıza:** Vitrindeki ürünler hafızada saklanır.

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip doğrudan kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
