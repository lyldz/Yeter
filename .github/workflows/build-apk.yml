name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yeter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeter-Debug-APK
          path: Yeter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Yeter! v1.0.2 - Android Kurulum Dosyası (APK)"
          body: |
            ### 📱 Yeter! v1.0.2 Sürümü Yayında

            #### 🎨 Yenilikler:
            - **Özel Uygulama Logosu & Simgesi:** Kırmızı-beyaz renklerde, arkasında para demetleri ve ön planda harcamaları durduran 5 parmak açık 'DUR / YETER' el sembolü ile yeni uygulama simgesi eklendi.
            - **Kırmızı - Beyaz Tema:** Uygulama genel tema rengi kırmızı ve beyaz renk paletine uyarlandı.
            - **Tüm Ekranlara Uyumluluk & Otomatik Güncelleme Desteği.**

            #### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `Yeter.apk` dosyasını telefonunuza indirip doğrudan kurabilirsiniz.
          files: Yeter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
